<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Empresa - Simulação Tributária</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { margin-bottom: 5px; color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #444; }
        input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #2b6cb0; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #2c5282; }
        .msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
        .error { color: #e53e3e; }
        .success { color: #38a169; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Login de empresa</h2>
        <p>Acesse sua conta para utilizar a plataforma de simulação tributária.</p>

        <form id="formLogin">
            <div class="form-group">
                <label>E-mail *</label>
                <input type="email" id="email" required placeholder="empresa@email.com">
            </div>

            <div class="form-group">
                <label>Senha *</label>
                <input type="password" id="senha" required placeholder="Sua senha de acesso">
            </div>

            <button type="submit" id="btnEntrar">Acessar plataforma</button>
            <div id="mensagem" class="msg"></div>

            <div style="margin-top: 15px; text-align: center; font-size: 13px; color: #666;">
                Ainda não tem conta? <a href="/cadastro" style="color: #2b6cb0; text-decoration: none; font-weight: bold;">Cadastre sua empresa aqui</a> | <a href="/" style="color: #666; text-decoration: none;">Início</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            const msgDiv = document.getElementById('mensagem');
            const btn = document.getElementById('btnEntrar');
            msgDiv.textContent = "Processando login...";
            msgDiv.className = "msg";
            btn.disabled = true;

            const dados = {
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };

            try {
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    msgDiv.textContent = "Login realizado com sucesso! Redirecionando...";
                    msgDiv.className = "msg success";

                    localStorage.setItem('empresa_id', resultado.empresa_id);
                    localStorage.setItem('nome_empresa', resultado.nome_empresa);
                    localStorage.setItem('empresa_email', resultado.email);

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1200);
                } else {
                    msgDiv.textContent = resultado.detail || "E-mail ou senha inválidos.";
                    msgDiv.className = "msg error";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Erro:", error);
                msgDiv.textContent = "Não foi possível conectar ao servidor.";
                msgDiv.className = "msg error";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
